<title>오천만분의 일</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 위에 시계(연·월·배속), 그 아래 갈림길 카드, 능력치와 올해 계획, 맨 아래로 흘러가는 인생 기록 */
:root{
  --paper:#f3f5f8; --sheet:#ffffff; --ink:#1a2132; --muted:#5f687a; --line:#dde2ea; --soft:#eef1f6;
  --blue:#2d4f9e; --blue-soft:#e6ecf8; --seal:#c3342b; --seal-soft:#fbe9e7; --news:#7a6428; --news-soft:#f6f1e4;
  --display:"Gowun Batang", "Nanum Myeongjo", serif; --body:"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0f131a; --sheet:#171c26; --ink:#e7ebf3; --muted:#9aa4b6; --line:#2a3242; --soft:#1e2531;
  --blue:#86a6f2; --blue-soft:#1f2a42; --seal:#ec6a5e; --seal-soft:#3a1f1e; --news:#d9c48f; --news-soft:#2a2618; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0f131a; --sheet:#171c26; --ink:#e7ebf3; --muted:#9aa4b6; --line:#2a3242; --soft:#1e2531;
  --blue:#86a6f2; --blue-soft:#1f2a42; --seal:#ec6a5e; --seal-soft:#3a1f1e; --news:#d9c48f; --news-soft:#2a2618; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:0 48px}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--paper)}
.wrap{max-width:920px; margin:0 auto; display:flex; flex-direction:column; gap:12px}
h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, input:focus-visible, textarea:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line); background:var(--sheet); border-radius:8px; padding:10px 14px}
.btn.primary{background:var(--ink); color:var(--sheet); border-color:var(--ink); font-weight:700}
.btn.ghost{background:transparent}
.sheet{background:var(--sheet); border:1px solid var(--line); border-radius:10px; padding:14px}
.note{font-size:12px; color:var(--muted); text-align:center; margin:0}

/* 시작 */
.start{padding-top:36px; display:flex; flex-direction:column; gap:18px}
.eyebrow{font-size:12px; letter-spacing:.14em; color:var(--seal); font-weight:700}
.start h1{font-size:40px; line-height:1.15}
.start p{color:var(--muted); margin:0}
.form{display:flex; flex-direction:column; gap:12px}
.form label{font-size:13px; color:var(--muted)}
.form input{font:inherit; font-size:17px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); width:100%}
.funeral{position:fixed; inset:0; z-index:200; background:#1d1b18; opacity:1; transition:opacity .5s}
.funeral.out{opacity:0}
.funeral canvas{display:block}
.f-cap{position:absolute; left:50%; bottom:5%; transform:translateX(-50%); text-align:center; color:#efe9dc; display:grid; gap:3px; animation:fcap 1.2s 1.4s both; text-shadow:0 1px 3px #000; white-space:nowrap}
.f-cap b{font-family:var(--display); font-size:22px; letter-spacing:.1em} .f-cap span{font-size:13px; opacity:.85}
.f-skip{position:absolute; top:14px; right:14px; color:#efe9dc; border-color:rgba(255,255,255,.35); background:rgba(0,0,0,.3)}
@keyframes fcap{from{opacity:0; transform:translate(-50%,8px)} to{opacity:1; transform:translate(-50%,0)}}
.end1{margin-top:12px; background:var(--sheet); border:2px solid var(--ink); border-radius:6px; padding:14px; display:grid; gap:10px; position:relative}
.e-ob{text-align:center; display:grid; gap:2px} .e-ob .seal{top:6px; right:8px; width:38px; height:38px; font-size:15px}
.e-ob .lbl{font-size:11px; letter-spacing:.3em; color:var(--muted)} .e-ob h2{font-size:24px}
.e-ob .years{font-family:var(--mono); font-size:12.5px; color:var(--muted)} .e-ob .cause{font-size:12px; color:var(--muted)}
.e-v{display:flex; justify-content:space-between; align-items:center; gap:10px; border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); padding:8px 0}
.e-v .t{font-family:var(--display); font-size:20px} .e-v .rank{font-family:var(--mono); font-size:12.5px; color:var(--seal)}
.e-sc{text-align:right; display:grid} .e-sc b{font-size:34px; color:var(--seal); line-height:1} .e-sc small{font-size:11px; color:var(--muted)} .e-sc span{font-size:11.5px; color:var(--blue); font-family:var(--display)}
.e-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px}
.e-grid div{background:var(--soft); border-radius:8px; padding:7px 8px; display:grid; min-width:0}
.e-grid span{font-size:11px; color:var(--muted)} .e-grid b{font-family:var(--display); font-size:16px; line-height:1.25; overflow-wrap:anywhere} .e-grid i{font-style:normal; font-size:10.5px; color:var(--muted)}
.end1 .quote{font-size:14.5px; margin:0}
.detail{display:grid; gap:10px; margin-top:12px} .detail[hidden]{display:none}
.end1 .row .btn{white-space:nowrap; padding:10px 6px; font-size:13.5px} .dh{font-size:15px; margin-bottom:8px}
.score{display:grid; gap:6px}
.sc-h{display:flex; justify-content:space-between; align-items:baseline; font-family:var(--display); font-size:17px}
.sc-h b{font-size:30px; color:var(--seal)} .sc-h small{font-size:13px; color:var(--muted)}
.sc-g{font-family:var(--display); font-size:15px; color:var(--blue); margin-top:-4px}
.sc-r{display:grid; grid-template-columns:80px 1fr 46px; gap:8px; align-items:center; font-size:12.5px}
.sc-r .num{font-size:11.5px; color:var(--muted); text-align:right}
.src summary{cursor:pointer; font-size:13.5px; font-weight:700}
.src ul{margin:8px 0 0; padding-left:16px; display:flex; flex-direction:column; gap:6px; font-size:12.5px}
.src small{display:block; color:var(--muted); font-size:11px}
.facts{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; font-size:12.5px; color:var(--muted)}
.facts div{background:var(--soft); border-radius:8px; padding:10px; min-width:0}
.facts b{display:block; color:var(--ink); font-size:15px; font-family:var(--display)}

/* 시계 */
.clock{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); padding-top:12px; padding-bottom:6px; display:flex; flex-direction:column; gap:8px; border-bottom:1px solid var(--line)}
.idline{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap}
.idline h2{font-size:21px}
.idline .when{font-family:var(--display); font-size:17px}
.idline .when b{color:var(--seal)}
.months{display:grid; grid-template-columns:repeat(12,1fr); gap:2px; position:relative}
.months span{height:18px; background:var(--soft); border-radius:3px; position:relative; overflow:hidden; font-size:9.5px; color:var(--muted); text-align:center; line-height:18px}
.months span i{position:absolute; inset:0 auto 0 0; background:var(--blue-soft); z-index:0}
.months span em{position:relative; z-index:1; font-style:normal}
.months span.ev::after{content:""; position:absolute; top:2px; right:2px; width:4px; height:4px; border-radius:50%; background:var(--seal); z-index:1}
.ctl{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.ctl button{border:1px solid var(--line); background:var(--sheet); border-radius:6px; padding:3px 9px; font-size:12.5px; font-family:var(--mono)}
.ctl button.on{background:var(--ink); color:var(--sheet); border-color:var(--ink)}
.ctl .sp{flex:1}
.ctl label{font-size:12.5px; color:var(--muted); display:flex; gap:4px; align-items:center}
.stagebar{display:grid; grid-template-columns:repeat(8,1fr); gap:3px}
.stagebar span{height:4px; border-radius:2px; background:var(--line)}
.stagebar span.done{background:var(--blue)} .stagebar span.now{background:var(--seal)}

/* 갈림길 카드 */
.decide{background:var(--sheet); border:2px solid var(--ink); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:12px; animation:pop .25s ease}
.decide.news{border-color:var(--news)}
.tiplink{cursor:help; text-decoration:underline dotted var(--muted); text-underline-offset:3px}
.tip{position:fixed; z-index:50; background:var(--ink); color:var(--sheet); border-radius:8px; padding:9px 11px; font-size:12px; line-height:1.5; box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tip ul{margin:4px 0 0; padding-left:16px} .tip li{margin:1px 0} .tip b{color:inherit}
.scene{display:block; width:100%; height:160px; border-radius:8px; margin-bottom:2px; background:var(--soft)}
.decide .k{font-size:12px; color:var(--seal); font-weight:700; letter-spacing:.06em}
.decide.news .k{color:var(--news)}
.decide .headline{font-size:13px; font-weight:700; color:var(--news); border-left:3px solid var(--news); padding-left:9px}
.decide p{font-family:var(--display); font-size:18.5px; line-height:1.6; margin:0; white-space:pre-line}
.decide .ctx{font-size:13px; color:var(--muted); font-family:var(--body); line-height:1.5}
.choices{display:flex; flex-direction:column; gap:7px}
.choice{text-align:left; border:1px solid var(--line); background:var(--paper); border-radius:9px; padding:11px 13px; display:flex; gap:10px; align-items:baseline}
.choice .n{font-family:var(--mono); font-size:12px; color:var(--muted)}
.choice:hover:not(:disabled){border-color:var(--blue)}
.choice:disabled{opacity:.45; cursor:not-allowed}
.choice small{display:block; color:var(--muted); font-size:11.5px}
.decide textarea{font:inherit; font-size:14px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); padding:8px 10px; resize:vertical; min-height:56px}
@keyframes pop{from{transform:translateY(6px); opacity:.5} to{transform:none; opacity:1}}

/* 능력치 · 계획 */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.cols{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:12px; align-items:start}
.lcol{display:flex; flex-direction:column; gap:12px; min-width:0}
.rcol{position:sticky; top:calc(var(--clockH,150px) + env(safe-area-inset-top,0px) + 8px); max-height:calc(100vh - var(--clockH,150px) - 24px); overflow-y:auto; min-width:0}
.fh{font-size:15px; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:-14px; background:var(--sheet); padding:4px 0; z-index:1}
.fh .btn{padding:2px 8px; font-size:12px}
.dn{display:none; font-family:var(--mono); font-size:12px; min-width:18px; text-align:center}
.stats{display:grid; gap:6px 14px; grid-template-columns:repeat(3,minmax(0,1fr))}
.topstats .money{margin-top:8px}
.more2{margin-top:8px; border-top:1px dashed var(--line); padding-top:6px}
.more2 summary{cursor:pointer; font-size:12.5px; color:var(--muted); list-style:none}
.more2 summary::before{content:'▸ '}
.more2[open] summary::before{content:'▾ '}
.more2 summary b{color:var(--blue)}
.more2 .tal{display:grid; gap:4px}
.stat{display:grid; grid-template-columns:36px 1fr 26px; gap:6px; align-items:center; font-size:12.5px}
.bar{height:6px; background:var(--soft); border-radius:3px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--blue); border-radius:3px; transition:width .4s}
.bar i.low{background:var(--seal)}
.stat .num{font-size:11.5px; text-align:right; color:var(--muted)}
.money{display:flex; justify-content:space-between; font-size:12.5px; border-top:1px dashed var(--line); padding-top:8px; margin-top:4px}
.money b{font-family:var(--mono)}
.chips{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px}
.chip{font-size:11px; padding:1px 7px; border-radius:20px; background:var(--soft); color:var(--muted)}
.chip.warn{background:var(--seal-soft); color:var(--seal)}
.plan h3{font-size:14px; display:flex; justify-content:space-between; align-items:baseline}
.plan h3 small{font-family:var(--mono); font-size:11.5px; color:var(--muted); font-weight:400}
.prow{display:grid; grid-template-columns:1fr auto; gap:2px 6px; align-items:center; padding:5px 0; border-bottom:1px dashed var(--line)}
.prow:last-child{border-bottom:none}
.prow .lb{font-size:13px}
.prow .lb small{display:block; font-size:10.5px; color:var(--muted); line-height:1.3}
.pctl{display:flex; align-items:center; gap:4px}
.pctl button{width:26px; height:26px; border:1px solid var(--line); background:var(--paper); border-radius:6px; padding:0; line-height:1}
.pctl button:disabled{opacity:.35; cursor:not-allowed}
.dots{font-family:var(--mono); font-size:11px; letter-spacing:-1px; color:var(--blue); min-width:62px; text-align:center}
.dots .lk{color:var(--muted)}
.plan .hint{font-size:11.5px; color:var(--muted); margin:6px 0 0}
.ptline{display:flex; flex-wrap:wrap; gap:4px; margin:4px 0 4px}
.chip.good{background:var(--blue-soft); color:var(--blue)}
.ftag{font-size:10px; color:var(--seal); border:1px solid var(--seal); border-radius:3px; padding:0 4px; margin-right:5px; vertical-align:1px}
.prow select{margin-top:3px; font:inherit; font-size:12px; padding:2px 4px; border:1px solid var(--line); border-radius:5px; background:var(--paper); color:var(--ink)}
.tal{margin-top:10px; padding-top:8px; border-top:1px dashed var(--line); display:grid; gap:4px}
.tal-h{font-size:12.5px; font-weight:700}
.tal-k{font-size:10.5px; color:var(--muted)}
.mbchip{font-family:var(--mono); font-size:12px; border:1px solid var(--blue); color:var(--blue); border-radius:4px; padding:0 5px; margin-left:4px; vertical-align:2px}
.mbbig{font-family:var(--mono); color:var(--blue); margin-left:4px}
.mbrow{display:grid; grid-template-columns:62px 1fr 62px; gap:6px; align-items:center; font-size:11px; color:var(--muted)}
.mbrow span:last-child{text-align:right}
.mbrow span.on{color:var(--ink); font-weight:700}
.mbbar{position:relative; height:6px; background:var(--soft); border-radius:3px}
.mbbar i{position:absolute; top:0; bottom:0; background:var(--blue); border-radius:3px}
.mbbar s{position:absolute; left:50%; top:-2px; bottom:-2px; width:1px; background:var(--line)}
.feed li.mb .x{color:var(--blue); font-weight:500}
.trow{display:grid; grid-template-columns:62px 1fr 92px; gap:6px; align-items:center; font-size:11.5px}
.trow .tw{font-size:11px; color:var(--muted); text-align:right; white-space:nowrap}
.trow.focus .tw{color:var(--seal)}
.feed li.settle{grid-template-columns:62px 1fr; background:var(--soft); border-radius:8px; padding:8px; margin:4px 0}
.stitle{font-family:var(--display); font-weight:700; font-size:14px; margin-bottom:4px}
.srow{display:grid; grid-template-columns:auto 1fr; gap:6px; align-items:baseline; font-size:12.5px; padding:2px 0}
.srow .d{margin-left:0}
.srow .why{color:var(--muted)}
.trow.focus span:first-child{color:var(--seal); font-weight:700}
.trow .bar{position:relative}
.trow .bar i{background:var(--blue-soft); position:absolute; inset:0 auto 0 0}
.trow .bar b{display:block; height:100%; background:var(--blue); opacity:.85; position:relative; border-radius:3px}
.trow.lock span:first-child{color:var(--muted)}
.tal-h .tal-k{font-weight:400; margin-left:4px}
.tal-h{margin-top:4px}
.trow .num{font-size:10.5px; color:var(--muted); text-align:right}

/* 인생 기록 피드 */
.feed{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.feed li{display:grid; grid-template-columns:62px 1fr; gap:8px; padding:6px 0; border-bottom:1px solid var(--soft); font-size:14px}
.feed li .t{font-family:var(--mono); font-size:11.5px; color:var(--muted); padding-top:2px; white-space:nowrap}
.feed li.m{color:var(--muted); font-size:13px}
.feed li.news .x{color:var(--news)}
.feed li.news .x b{display:block; font-size:12px}
.feed li.dec .x{font-weight:500}
.feed li.dec .x small{display:block; color:var(--muted); font-weight:400; font-size:12px}
.feed li.yr{grid-template-columns:1fr; border-bottom:none; padding-top:14px}
.feed li.yr .x{font-family:var(--display); font-size:16px; font-weight:700}
.feed li.big .x{font-weight:700}
.feed li.think .x{font-family:var(--display); color:var(--blue)}
.d{font-family:var(--mono); font-size:11px; padding:0 6px; border-radius:3px; margin-left:4px; white-space:nowrap}
.d.up{background:var(--blue-soft); color:var(--blue)} .d.down{background:var(--seal-soft); color:var(--seal)}
.feed li.fresh{animation:fresh .6s ease}
@keyframes fresh{from{background:var(--blue-soft)} to{background:transparent}}

/* 엔딩 */
.obit{background:var(--sheet); border:2px solid var(--ink); border-radius:4px; padding:22px 20px; position:relative; display:flex; flex-direction:column; gap:6px; text-align:center}
.obit .lbl{font-size:12px; letter-spacing:.3em; color:var(--muted)}
.obit h2{font-size:30px}
.obit .years{font-family:var(--mono); color:var(--muted)}
.obit .cause{font-size:13.5px; color:var(--muted)}
.seal{position:absolute; right:14px; top:14px; width:46px; height:46px; border:2.5px solid var(--seal); color:var(--seal); border-radius:50%; display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:18px; transform:rotate(-8deg)}
.verdict{text-align:center; display:flex; flex-direction:column; gap:4px}
.verdict .t{font-family:var(--display); font-size:26px}
.verdict .rank{font-family:var(--mono); font-size:15px; color:var(--seal)}
.verdict .s{color:var(--muted); font-size:14px}
.metrics{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.metric{background:var(--sheet); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:0}
.metric .k{font-size:12px; color:var(--muted)} .metric .v{font-family:var(--display); font-size:21px; line-height:1.3} .metric .x{font-size:12px; color:var(--muted); margin-top:4px}
.metric.wide{grid-column:1/-1}
.quote{font-family:var(--display); font-size:17px; text-align:center; margin:0}
.hl{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:7px}
.hl li{display:grid; grid-template-columns:48px 1fr; gap:8px; font-size:14px}
.hl li .num{color:var(--blue); font-size:12.5px; padding-top:2px}
.titles{display:flex; flex-wrap:wrap; gap:6px}
.titles span{border:1px solid var(--seal); color:var(--seal); border-radius:4px; padding:2px 10px; font-size:13px; font-family:var(--display)}
.row{display:flex; gap:8px; flex-wrap:wrap}
@media (max-width:460px){ .grid2{grid-template-columns:1fr} .start h1{font-size:34px} .decide p{font-size:17px} .months span em{font-size:8px} }
@media (max-width:620px){
  .cols{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); gap:6px}
  .lcol{gap:6px}
  .cols .sheet{padding:9px}
  .plan h3, .fh{font-size:13px}
  .prow{grid-template-columns:minmax(0,1fr) auto; gap:4px; padding:3px 0}
  .prow .lb{font-size:11.5px; line-height:1.3} .prow .lb small{display:none}
  .prow select{font-size:10.5px; max-width:100%; margin-top:2px}
  .pctl{gap:2px} .pctl button{width:22px; height:22px; font-size:12px}
  .plan .hint{display:none}
  #rec{font-size:11.5px; padding:4px !important}
  .dots{display:none} .dn{display:inline-block}
  .ftag{font-size:9px; padding:0 3px}
  .ptline .chip{font-size:10px}
  .stat{grid-template-columns:28px 1fr 18px; font-size:11px; gap:3px}
  .stats{gap:5px 8px}
  .topstats{padding:9px}
  .stat .num{font-size:10px}
  .money{font-size:11px} .money b{font-size:12px}
  .chips .chip{font-size:10px}
  .trow{grid-template-columns:48px 1fr; font-size:10.5px}
  .trow .tw{grid-column:1/-1; text-align:left; font-size:10px; margin-top:-2px}

const R = Math.random;
const ri = (a,b)=>a+Math.floor(R()*(b-a+1));
const pick = a=>a[Math.floor(R()*a.length)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
function gauss(){ let u=1-R(), v=R(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function phi(z){ const t=1/(1+.2316419*Math.abs(z)); const d=.3989423*Math.exp(-z*z/2); const p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0?1-p:p; }
function wpick(items, wf){ let tot=0; const ws=items.map(it=>{const w=Math.max(0,wf(it)); tot+=w; return w;}); if(tot<=0) return null; let r=R()*tot; for(let i=0;i<items.length;i++){ r-=ws[i]; if(r<0) return items[i]; } return items[items.length-1]; }
function won(m){ m=Math.round(m); const neg=m<0; m=Math.abs(m); let s; if(m>=10000){ const e=m/10000; s=(e>=100?Math.round(e):Math.round(e*10)/10).toLocaleString('ko-KR')+'억'; } else s=m.toLocaleString('ko-KR')+'만원'; return (neg?'-':'')+s; }

const SK = {학:'학력',체:'체력',멘:'멘탈',행:'행복',인:'인맥',매:'매력'};
const HID = ['risk','par','hon','spec','eng','kid'];
var S = null;

function add(S,e){
  for(const k in e){ const v=e[k];
    if(SK[k]) S.s[k]=clamp(S.s[k]+v,0,100);
    else if(k==='돈') S.money+=v;
    else if(HID.includes(k)) S.h[k]=k==='hon'?Math.max(0,S.h[k]+v):clamp(S.h[k]+v,0,100);
    else if(k==='f') [].concat(v).forEach(x=>S.f.add(x));
    else if(k==='uf') [].concat(v).forEach(x=>S.f.delete(x));
    else if(k==='title') S.titles.add(v);
    else if(k==='hl') hl(S,v);
  }
}
function hl(S,t){ S.hlist.push({age:S.age, year:S.year, t}); }
function log(S,t,kind){ if(t) S.log.push({age:S.age, year:S.year, t, kind:kind||''}); }
function evById(id){ return {kind:'ev', id}; }
const EVMAP = {}; EVENTS.forEach(e=>EVMAP[e.id]=e);
function killNow(S,cause,text){ S.dead=true; S.cause=cause; S.deathText=text; return text; }
function tierBonus(S){ return ({S:.25,A:.15,B:.08,C:.03,D:0,E:-.03})[S.tier] ?? -.05; }
function kidsInSchool(S){ return S.kidBirth.some(b=>{const a=S.age-b; return a>=7&&a<=18;}); }
function haveKids(S,n){
  S.kids+=n; for(let i=0;i<n;i++) S.kidBirth.push(S.age+1+i*2);
  add(S,{f:['자녀결정','출산'], 행:10, 체:-4, kid:5});
  if(S.year>=2022) add(S,{돈:200*n});
  hl(S, n===1?`${S.age+1}세, 첫 아이 출산`:`아이 ${n}명의 부모가 됐다`);
  return n===1 ? '아이가 태어났다. 3.2kg. 세상에서 제일 작은 손이었다.' : '두 아이의 부모가 됐다. 집이 시끄럽고, 따뜻해졌다.';
}
function regionPrice(S){ return S.region.name.startsWith('서울') ? 100000 : S.region.name.startsWith('경기') ? 60000 : 40000; }
function buyHouse(S, yeong){
  let price;
  if(yeong){ price = Math.max(regionPrice(S), S.money*3); S.f.add('영끌'); }
  else { price = Math.round(S.money*2); }
  const loan = Math.max(0, price - S.money);
  S.house = {val:price, loan, bought:price, by:S.year};
  S.money = 0; add(S,{행:8});
  hl(S, `${S.age}세, 내 집 마련 (${won(price)})`);
  return yeong ? `대출 ${won(loan)}을 끼고 ${won(price)}짜리 집을 샀다. 등기부등본에 내 이름이 찍혔다.` : `${won(price)}짜리 작은 집을 샀다. 크진 않지만 이사 걱정은 끝났다.`;
}
function covid(S){
  const a=S.age;
  if(a>=7&&a<=18){ add(S,{학:-3, 인:-5, 행:-2}); S.titles.add('코로나 학년'); return '온라인 개학. 카메라를 끄고 잠옷 바람으로 수업을 들었다. 친구 얼굴을 1년 동안 화면으로만 봤다.'; }
  if(S.studying){ add(S,{인:-6, 행:-4}); S.titles.add('코로나 학번'); return '새내기 OT도, MT도 없었다. 동기 얼굴을 졸업 때 처음 봤다.'; }
  if(S.job&&S.job.kind==='자영'){ add(S,{돈:-2500, 멘:-12}); return '가게 매출이 70% 줄었다. 대출로 버텼다.'; }
  if(S.job&&S.job.kind==='사무'){ add(S,{행:3}); return '재택근무가 시작됐다. 회의 중에 바지를 안 입은 건 비밀이다.'; }
  if(!S.job&&a>=23&&a<=32){ add(S,{멘:-6}); return '하반기 공채가 줄줄이 취소됐다.'; }
  if(a>=65){ add(S,{체:-3, 행:-3}); return '경로당이 문을 닫았다. 하루가 길어졌다.'; }
  return '마스크 없이 외출하던 날들이 그리워졌다.';
}

  const impulsive = R(), talent = clamp(.85+R()*.3+(wealth>=8?.04:0),.8,1.25), luck=R();
  const st = {학:clamp(22+wealth*2+ri(-6,8),5,60), 체:ri(45,70), 멘:ri(50,65)+(family==='화목'?5:family==='갈등'?-8:0), 행:ri(55,70)+(family==='갈등'?-8:0), 인:ri(35,50), 매:ri(30,60)};
  S = { name: name||randName(gender,birthYear), gender, birthYear, year:birthYear, age:0, region, wealth, wealth0:wealth, rich, family, siblings, impulsive, talent, luck,
    s:st, money:0, h:{risk: Math.round((family==='갈등'?15:family==='보통'?5:0)+impulsive*15+(wealth<=2?5:0)), par:family==='화목'?70:family==='보통'?55:35, hon:0, spec:0, eng:wealth>=8?10:0, kid:50},
    f:new Set(), titles:new Set(), seen:new Set(), hlist:[], log:[], queue:[],
    job:null, track:null, attempts:0, studying:false, studyLeft:0, major:null, tier:null, retry:0, suneungAge:18,
    armyLeft:0, kids:0, kidBirth:[], house:null, retired:false, pension:0, parentDeathAge: ri(48,66),
    dead:false, cause:null, happySum:0, happyN:0, turn:0, mode:mode||'normal' };
  S.f.add('생존');
  S.queue.push({kind:'ms', name:'birth'});
  S.queue.push(...pickRegular(S, nEvents(S)));
  hl(S, `${birthYear}년, ${region.name}에서 태어났다`);
  return S;
}

/* ---------- 해마다 ---------- */
const CAUSES = [[15,['소아암','불의의 사고']],[35,['교통사고','불의의 사고','급성 심장마비']],[60,['암','심근경색','뇌출혈','교통사고']],[80,['암','심장 질환','뇌졸중','폐렴']],[999,['노환','폐렴','심장 질환']]];
function baseQ(a){ if(a<=1) return .0025; if(a<15) return .0001; return .00003*Math.exp(.095*a); }

function yearTick(S, ms){
  S.age++; S.year=S.birthYear+S.age;
  S.happySum+=S.s.행; S.happyN++;
  // 노화 · 회귀
  if(S.age>=40) add(S,{체:-1}); if(S.age>=65) add(S,{체:-1.5});
  S.s.멘 += (52-S.s.멘)*.07; S.s.행 += (50-S.s.행)*.09;
  // 비행 감소 (청소년기 한정형 vs 생애지속형)
  if(S.age>=19){ const persist = S.f.has('비행또래') && S.family==='갈등' && (S.f.has('가출')||S.f.has('보호관찰')); S.h.risk *= persist?.96:.86; }
  // 군 복무
  if(S.armyLeft>0){ S.armyLeft--; if(S.armyLeft===0){ S.f.add('군필'); S.f.delete('복무중'); ms.push({kind:'ms', name:'discharge'}); } }
  else if(S.studying){ S.studyLeft--; if(S.studyLeft<=0){ S.studying=false; S.f.add('졸업'); ms.push({kind:'ms', name:'grad'}); } }
  // 돈
  if(S.job){ S.money += S.job.sal*.13; S.job.sal*=(typeof salGrowth==='function'? salGrowth(S) : (S.age<55?1.03:1)); S.h.hon += (S.job.hon||0)*.12; }
  else if(S.retired){ S.money += (S.age>=65?S.pension:S.pension*.5) - (S.money<0?1000:1600); }
  else if(S.age>=24 && !S.studying && S.armyLeft===0){ S.money -= S.wealth>=8?150:500; }
  S.kidBirth.forEach(b=>{ const a=S.age-b; if(a>=0&&a<22) S.money-=800; });
  if(S.house){ S.house.val *= 1+(S.year>=2017&&S.year<=2021?.07:S.year===2022||S.year===2023?-.06:.01)+gauss()*.02; if(S.house.loan>0){ const pay=Math.min(S.house.loan,1800); S.house.loan-=pay; S.money-=pay+S.house.loan*.035; } }
  if(S.money>0) S.money*=1.005;
  // 퇴직
  if(S.job){ const lim = (S.job.kind==='선수'?36 : S.job.kind==='자영'?70 : S.job.kind==='공공'?62 : 60) + (S.f.has('정년연장')?5:0); if(S.age>=lim) ms.push({kind:'ms', name:'retire'}); }
  // 부모님
  if(!S.f.has('부모별세') && S.age>=S.parentDeathAge){ S.f.add('부모별세'); ms.push({kind:'ms', name:'parents'}); }
  // 사망 판정
  let q = baseQ(S.age) * clamp(1+(50-S.s.체)/40,.6,2.8);
  if(S.f.has('지병')) q*=1.8;
  let extra=null;
  if(S.f.has('오토바이') && S.age<60 && R()<.0025) extra=['오토바이 사고','빗길 교차로였다.'];
  if(S.f.has('과로') && S.age>=35 && S.s.체<30 && R()<.004) extra=['과로사','책상 위에 결재 서류가 쌓여 있었다.'];
  if(extra){ killNow(S,extra[0],extra[1]); return; }
  if(R()<q){ const list=CAUSES.find(c=>S.age<c[0])[1]; killNow(S,pick(list),''); }
}

/* ---------- 턴 진행 ---------- */
function nEvents(S){ const a=S.age; if(S.mode==='short') return 1; if(S.mode==='long') return a<=45?(a<=25&&R()<.4?3:2):1; return a<=30?2:1; }
function pickRegular(S,n){
  const a=S.age, out=[];
  let pool = EVENTS.filter(e=>!e.manual && a>=e.a[0] && a<=e.a[1] && (e.rep||!S.seen.has(e.id)) && (!e.if||e.if(S)) && (S.armyLeft>0 ? e.tag==='army' : e.tag!=='army'));
  for(let i=0;i<n;i++){ const ev=wpick(pool, e=>typeof e.w==='function'?e.w(S):(e.w??1)); if(!ev) break; out.push({kind:'ev', id:ev.id}); pool=pool.filter(e=>e!==ev); }
  return out;
}
function advance(S){
  S.turn++;
  const step = S.mode==='short' ? (S.age<25?1:S.age<60?2:3) : S.mode==='long' ? 1 : (S.age<65?1:2);
  const ms=[], news=[];
  for(let i=0;i<step;i++){
    yearTick(S, ms);
    if(S.dead){ S.queue=[{kind:'death'}]; return; }
    NEWS.forEach((n,idx)=>{ if(n.y===S.year && S.age>=n.a[0] && S.age<=n.a[1] && (!n.if||n.if(S))) news.push(idx); });
  }
  const q=[];
  q.push(...ms);
  news.sort((a,b)=>(NEWS[b].c?1:0)-(NEWS[a].c?1:0)).slice(0,2).sort((a,b)=>a-b).forEach(idx=>q.push({kind:'news', idx}));
  // 나이별 고정 단계
  const a=S.age;
  if(a===7) q.push({kind:'info', title:'초등학교 입학', text:`${S.year}년 3월. 몸보다 큰 책가방을 메고 ${S.region.name.split(' ')[1]||''} 어느 초등학교에 입학했다.`});
  if(a===13) q.push({kind:'info', title:'중학교 입학', text:'교복이 두 치수 크다. 엄마는 “금방 큰다”고 했다.'});
  if(a===15) q.push({kind:'ms', name:'highschool'});
  if(a===S.suneungAge && a>=18 && a<=22 && !S.studying && !S.job && (!S.f.has('자퇴')||S.f.has('검정고시')) && !S.f.has('수능포기')) q.push({kind:'ms', name:'suneung'});
  if(S.gender==='M' && !S.f.has('군필') && !S.f.has('면제') && S.armyLeft===0 && a>=20 && a<=28 && (a>=21 || S.studying || S.f.has('졸업') || S.job || S.track)) q.push({kind:'ms', name:'army'});
  if(S.armyLeft===0 && !S.job && !S.studying && !S.retired && a>=19 && a<=60 && (a>S.suneungAge || S.f.has('수능포기'))){
    if(!S.track) q.push({kind:'ms', name:'track'}); else q.push({kind:'ms', name:'hunt'});
  }
  // 일반 이벤트
  q.push(...pickRegular(S, nEvents(S)));
  if(!q.length) q.push({kind:'info', title:'평범한 한 해', text:pick(['특별한 일 없이 한 해가 지나갔다.','그럭저럭 무난한 해였다.','달력이 금방 넘어갔다.'])});
  S.queue.push(...q);
}

/* ---------- 고정 단계(마일스톤) ---------- */
function birthEra(y){ if(y<=1992) return '거리에는 서태지와 아이들 노래가 흘러나왔다.'; if(y<=1996) return '아빠는 삐삐를 차고 다녔고, 집에는 비디오테이프가 쌓여 있었다.'; if(y<=1998) return '나라 경제가 흔들리던 해였다. 어른들 얼굴에 그늘이 졌다.'; if(y<=2001) return '새천년이 열렸다. 집에 처음으로 인터넷이 들어왔다.'; if(y<=2004) return '온 나라가 월드컵의 여운에 젖어 있었다.'; if(y<=2007) return '엄마는 싸이월드에 내 사진을 매일 올렸다.'; return '아빠는 첫 스마트폰으로 내 사진을 수백 장 찍었다.'; }
const TIERNAME = {S:'최상위권 대학 (가칭 서울 S대)', A:'상위권 대학', B:'인서울 대학', C:'수도권·지방거점 국립대', D:'지방 사립대', E:'전문대'};

   return {title:`${S.year+1}학년도 대학수학능력시험`, text:`${S.year}년 11월. 성적표를 받았다.\n\n${d.g.join(' · ')}등급\n전국 상위 ${d.top}%${d.note}`, choices:ch, big:`상위 ${d.top}%`};

     else if(t==='공무원') p=.04+S.s.학/1200+S.attempts*.035;

     else if(t==='중소기업') p=.88;

     else if(t==='영업직') p=.3+ability(S,'말솜씨')/120;
     if(typeof snowHunt==='function') p+=snowHunt(S);
     d.ok = R()<clamp(p,.02,.92);
     if(d.ok){
       if(t==='아이돌'){ S.job={name:'크리에이터', sal:15000, hon:3, kind:'자영'}; S.titles.add('아이돌 데뷔'); d.txt='데뷔 성공! 음악방송 1위 앵콜 무대에서 울었다.'; }

       else if(t==='운동선수'){ S.job={name:'운동선수', ...JOBS['운동선수'], sal:Math.round(3000+ability(S,'운동신경')*50)}; S.titles.add('프로 데뷔'); d.txt=`프로 입단! 연봉 ${won(S.job.sal)}. 유니폼에 내 이름이 박혔다.`; }
       else if(t==='크리에이터'){ if(R()<.12){ S.job={name:'크리에이터', sal:20000, hon:2, kind:'자영'}; S.titles.add('유튜브 100만'); d.txt='영상 하나가 터졌다. 구독자 100만! 골드버튼이 집으로 왔다.'; } else { S.job={name:'크리에이터', sal:2600, hon:0, kind:'자영'}; d.txt='구독자 3만. 밥은 먹고 산다.'; } }
       else if(typeof JOBCAT!=='undefined' && JOBCAT[t] && JOBCAT[t].hire){ d.txt=JOBCAT[t].hire(S); }
       else { const base=JOBS[t]||JOBS['중소기업']; S.job={name:t, ...base, sal:Math.round(base.sal*(.9+R()*.2))}; d.txt=`합격! ${t}에 들어갔다. 연봉 ${won(S.job.sal)}.`; }
       hl(S,`${S.age}세, ${S.job.name} 취업`); add(S,{행:8, 멘:6, risk:-10});
       d.title='합격';
     } else {
       add(S,{멘:-6});
       d.title=`${t} 도전 ${S.attempts}년차`;
       d.txt = t==='공무원'?`불합격. 커트라인에서 ${ri(1,6)}점 모자랐다.`: t==='아이돌'?'데뷔조에서 밀렸다.':'서류 탈락 메일이 쌓였다. “귀하의 역량은 뛰어나나…”';
     }
   }
   if(d.ok) return {title:d.title, text:d.txt, choices:[]};
   const ch=[{l:'한 번 더 도전', run:S=>{ add(S,{멘:-3}); return '이번엔 될 거다.'; }}];
   if(S.track!=='중소기업') ch.push({l:'눈높이를 낮춰 중소기업', run:S=>{ S.track='중소기업'; S.queue.unshift({kind:'ms', name:'hunt'}); return '채용 공고를 다시 봤다.'; }});
   ch.push({l:'진로를 바꾼다', run:S=>{ S.track=null; return '처음부터 다시 생각하기로 했다.'; }});
   if(S.age>=35) return {title:d.title, text:d.txt+'\n\n나이 제한이 다가온다.', choices:[{l:'아는 사람 소개로 취업', run:S=>{ S.job={name:'중소기업', ...JOBS['중소기업']}; hl(S,`${S.age}세, 지인 소개로 중소기업 취업`); return '삼촌 친구 회사에 들어갔다.'; }}]};
   return {title:d.title, text:d.txt, choices:ch};
 }},
 retire:{build:(S)=>{ const j=S.job; if(!j) return {title:'은퇴 생활', text:'출근하지 않는 아침에 익숙해졌다.', choices:[]};
   if(j.kind==='선수'){ S.job={name:'코치·지도자', ...JOBS['코치·지도자']}; S.h.hon+=6; hl(S,`${S.age}세, 선수 은퇴 후 코치로`); return {title:'선수 은퇴', text:`${S.year}년, 선수 생활을 마쳤다. 은퇴식에서 팬들이 이름을 불러줬다. 이제 후배들을 가르친다.`, choices:[]}; } S.pension = j.kind==='공공'?2600 : j.sal>6000?1800 : 1200; S.h.hon+=j.hon*2; S.retired=true; S.job=null; hl(S,`${S.age}세, ${j.name} 정년퇴직`); return {title:'퇴직', text:`${S.year}년, ${j.name} 생활을 마쳤다. 송별회에서 받은 꽃다발이 무거웠다.`, choices:[]}; }},
 parents:{build:(S)=>{ const memo=(typeof parentsMemory==='function')?parentsMemory(S):''; const inh = (typeof inheritAmount==='function')? inheritAmount(S) : Math.round(S.wealth*S.wealth*220/(S.siblings+1)); add(S,{돈:inh, 멘:-12, 행:-6}); hl(S,`${S.age}세, 부모님을 떠나보냈다`); return {title:'부모님 별세', text:`${S.year}년, 부모님이 세상을 떠나셨다. 장례식장에서 처음으로 부모님 친구분들 얼굴을 봤다.${memo?'\n\n'+memo:''}\n\n상속: ${inh>0?won(inh):'없음'}${S._inhTax?` (상속세 ${won(S._inhTax)} 납부 후)`:''}`, choices:[]}; }},
};

/* ---------- 카드 만들기 · 고르기 ---------- */
function stageOf(a){ return a<7?'영유아':a<13?`초등 ${a-6}학년`:a<16?`중${a-12}`:a<19?`고${a-15}`:a<30?'청년':a<50?'장년':a<65?'중년':'노년'; }

function buildCard(S, d){
  if(d.kind==='ev'){ const ev=EVMAP[d.id]; return {kind:'ev', kicker:'생활기록', text: typeof ev.t==='function'?ev.t(S):ev.t, choices:ev.c.map(c=>({l:c.l, ok:!c.need||c.need(S), needT:c.needT}))}; }
  if(d.kind==='news'){ const n=NEWS[d.idx];
    if(!d.cached){ d.extra = n.run?n.run(S):''; if(n.e && !n.c) add(S,n.e); d.cached=true; }
    const body=[d.extra, n.t].filter(Boolean).join('\n\n');
    return {kind:'news', kicker:`${n.y}년 뉴스${n.future?' · 가상 시나리오':''}`, headline:n.h, text:body, choices:(n.c||[]).map(c=>({l:c.l, ok:!c.need||c.need(S), needT:c.needT}))}; }
  if(d.kind==='ms'){ if(d.static) return {kind:'ms', kicker:d.static.title, title:d.static.title, text:d.static.text, choices:[]};
    const m=MS[d.name].build(S,d); d._m=m; if(!m.choices.length) d.static={title:m.title, text:m.text}; return {kind:'ms', kicker:m.title, title:m.title, text:m.text, big:m.big, choices:m.choices.map(c=>({l:c.l, ok:!c.need||c.need(S), needT:c.needT}))}; }
  if(d.kind==='info') return {kind:'info', kicker:d.title, title:d.title, text:d.text, choices:[]};
  return {kind:'death', choices:[]};
}
function resolveCard(S, d, i){
  let txt='';
  if(d.kind==='ev'){ const ev=EVMAP[d.id]; S.seen.add(ev.id); const c=ev.c[i];
    if(c.e) add(S,c.e);
    if(c.o){ let r=R(); for(const o of c.o){ r-=o[0]; if(r<0||o===c.o[c.o.length-1]){ add(S,o[2]||{}); txt=o[1]; break; } } }
    else if(c.run) txt=c.run(S); else txt=c.t||'';
    log(S, txt||c.l);
  } else if(d.kind==='news'){ const n=NEWS[d.idx];
    if(i>=0 && n.c){ const c=n.c[i]; if(c.e) add(S,c.e); txt = c.run?c.run(S):(c.t||''); }
    log(S, n.h.replace(/^\[[^\]]+\]\s*/,'')+' → '+((txt||d.extra||n.t||'').split(/\.\s/)[0].replace(/\.$/,''))+'.', 'news');
  } else if(d.kind==='ms'){ const m=d.static?{...d.static, choices:[]}:(d._m||MS[d.name].build(S,d));
    if(i>=0 && m.choices[i]) txt=m.choices[i].run(S);
    log(S, (m.title?m.title+': ':'')+(txt||m.text.split('\n')[0]));
  } else if(d.kind==='info'){ log(S, d.title); }
  return txt;
}

/* ---------- 엔딩 ---------- */
function ending(S){
  const house = S.house ? S.house.val - S.house.loan : 0;
  const asset = S.money + house + (S.inv||0);
  const avgH = S.happyN? S.happySum/S.happyN : S.s.행;
  // 자녀 · 제사
  let kidsAlive = S.kids, rel=S.h.kid, attend=0, jesa, jesaT;
  if(S.kids===0){ jesa='없음'; jesaT = S.siblings>0 ? '제사를 지내줄 자손이 없다. 조카가 기일에 가끔 납골당을 찾는다.' : '기일을 기억하는 사람이 없다.'; }
  else {
    const per = 1 + (R()<.7?1:0) + (S.f.has('손주')?1.6:.6);
    attend = Math.max(1, Math.round(S.kids*per*clamp(rel/70,.2,1.3)));
    const late = S.birthYear+S.age>2060;
    if(rel>=70 && attend>=5){ jesa='정성 가득한 제사상'; jesaT=`기일마다 ${attend}명이 모여 홍동백서 4열 제사상을 차린다.${late?' 제사가 사라진 시대에 보기 드문 집안이다.':''}`; }
    else if(rel>=45){ jesa='간소한 추도식'; jesaT=`기일에 ${attend}명이 모여 사진 앞에 꽃을 두고 밥을 먹는다.`; }
    else { jesa='문자 한 통'; attend=Math.min(attend,1); jesaT='기일에 단톡방에 “오늘 아빠(엄마) 기일이네” 한 줄이 올라온다.'; }
  }
  const mourners = Math.round(S.s.인*1.6 + S.h.hon*4 + S.kids*18 + (S.job||S.retired?20:0) + ri(0,15));
  const honor = Math.round(S.h.hon);
  // 칭호
  const T=new Set(S.titles);
  if(S.age>=100) T.add('백세 인생'); if(S.age<30) T.add('너무 이른 이별');
  if(S.wealth0<=3 && (S.tier==='S'||(S.job&&['의사','변호사'].includes(S.job.name))||asset>=300000)) T.add('개천에서 용');
  if(S.rich) T.add('금수저');
  if(S.f.has('자퇴') && asset>=100000) T.add('학교 밖에서 성공');
  if(S.f.has('영끌') && S.house && S.house.val>S.house.bought*1.3) T.add('영끌 성공');
  if(S.kids>=3) T.add('다둥이');
  // 점수
  const sAsset = clamp((Math.log10(Math.max(asset,0)+1)-3)/2.7,0,1);
  const sLife = clamp((S.age-40)/50,0,1);
  const sFam = S.kids? clamp(Math.min(S.kids,3)/3*.5 + rel/100*.5,0,1) : .15;
  const sHon = clamp(honor/60,0,1);
  const sHap = avgH/100;
  const total = .3*sAsset+.15*sLife+.2*sFam+.15*sHon+.2*sHap;
  const top = clamp((1-phi((total-.45)/.13))*100,.1,99.9);
  // 엔딩 이름
  const succ = sAsset*.7+sHon*.3, hap = sHap*.7+sFam*.3;
  let title, sub;
  if(S.age<30){ title='너무 이른 이별'; sub='남은 사람들이 오래 기억했다.'; }
  else if(succ>=.45 && hap>=.42){ title='대한민국 1%의 여유'; sub='가진 것도, 곁에 있는 사람도 많았다.'; }
  else if(succ>=.45){ title='성공했지만 외로운'; sub='통장은 두둑했지만 저녁 식탁은 조용했다.'; }
  else if(hap>=.42){ title='소확행 장인'; sub='큰돈은 없었지만 잘 웃었다.'; }
  else { title='헬조선 생존자'; sub='끝까지 버텼다. 그것만으로도 대단했다.'; }
  // 유족의 한마디
  let quote;
  if(S.kids===0) quote = S.f.has('기혼')?'“당신이랑 둘이라서 좋았어.” (배우자)':'“좋은 친구였어.” (오랜 친구)';
  else if(rel>=70) quote = `“${S.gender==='M'?'아빠':'엄마'}가 해준 김치찌개가 아직 생각나요.” (자녀)`;
  else if(rel>=45) quote = `“${S.gender==='M'?'아빠':'엄마'}는 늘 바빴지만, 우리를 위해서였다는 걸 이제 알아요.” (자녀)`;
  else quote = '“솔직히… 잘 몰랐어요, 어떤 분이셨는지.” (자녀)';
  return {succ, hap, asset, house, avgH:Math.round(avgH), jesa, jesaT, attend, mourners, honor, titles:[...T], top:Math.round(top*10)/10, title, sub, quote};
}

/* ---------- 저장 ---------- */
function serialize(S){ if(!S) return null; return JSON.stringify({...S, f:[...S.f], titles:[...S.titles], seen:[...S.seen], queue:S.queue.map(d=>{const c={...d}; delete c._m; return c;})}); }
function deserialize(str){ const o=JSON.parse(str); o.f=new Set(o.f); o.titles=new Set(o.titles); o.seen=new Set(o.seen); return o; }

/* ---------- 자동 플레이 (밸런스 확인용) ---------- */
function simulate(n){
  const out={ages:[], causes:{}, tiers:{}, jobs:{}, errors:[], tops:[], titles:{}, endings:{}, kids:0, cards:[]};
  for(let k=0;k<n;k++){
    try{
      newGame(); let cards=0;
      while(!S.dead && cards<600){
        if(!S.queue.length) advance(S);
        const d=S.queue.shift(); if(d.kind==='death') break;
        const c=buildCard(S,d); cards++;
        const okIdx=c.choices.map((x,i)=>x.ok?i:-1).filter(i=>i>=0);
        resolveCard(S,d, okIdx.length?pick(okIdx):-1);
      }
      const e=ending(S);
      out.ages.push(S.age); out.causes[S.cause]=(out.causes[S.cause]||0)+1; out.tiers[S.tier||'-']=(out.tiers[S.tier||'-']||0)+1;
      const jn=(S.job&&S.job.name)||(S.retired?'은퇴':'무직'); out.jobs[jn]=(out.jobs[jn]||0)+1; out.tops.push(e.top); out.endings[e.title]=(out.endings[e.title]||0)+1; out.kids+=S.kids; out.cards.push(cards);
      e.titles.forEach(t=>out.titles[t]=(out.titles[t]||0)+1);
    }catch(err){ out.errors.push(String(err.stack||err)); }
  }
  return out;
}

function isDecision(d, card){
  if(d.kind==='ev') return MAJOR.has(d.id) && card.choices.some(c=>c.ok);
  if(d.kind==='news') return !!NEWS[d.idx].decide && card.choices.some(c=>c.ok);
  if(d.kind==='ms') return card.choices.length>0;
  if(d.kind==='think') return true;
  return false;
}
// 캐릭터가 알아서 고르기: 일탈 수치가 높으면 위험한 쪽으로 기운다

function recommendAlloc(S){
  const a=S.age, A={};
  if(a<4){ const rich=S.wealth>=8; Object.assign(A,{study:rich?3:1, exercise:2, rest:3, fun:3-(rich?2:0), family:1}); A.fun=Math.max(A.fun,1); }

  else if(S.job) Object.assign(A,{work:5, rest:2, fun:1, exercise:1, family:1});
  else if(S.retired) Object.assign(A,{rest:3, exercise:3, fun:2, social:2});
  else Object.assign(A,{study:4, rest:2, work:2, fun:1, social:1});

}
function fixAlloc(S,A){
  const list=acts(S), out={}; let tot=0;
  list.forEach(x=>{ out[x.k]=Math.max(x.min, A[x.k]||0); tot+=out[x.k]; });
  // 합계 10으로 맞추기
  const order=['rest','fun','exercise','social','study','style','family','work'].filter(k=>out[k]!=null);
  let guard=0;
  while(tot>10 && guard++<50){ for(const k of order){ const mn=list.find(x=>x.k===k).min; if(tot>10 && out[k]>mn){ out[k]--; tot--; } } }
  while(tot<10 && guard++<100){ out[order[guard%order.length]]++; tot++; }
  return out;
}
function allocEffects(S,A){

  acts(S).forEach(x=>{ const p=A[x.k]||0; for(const k in x.eff){ tot[k]=(tot[k]||0)+x.eff[k]*p; } });
  if((A.study||0)+(A.work||0)>=8){ tot.체=(tot.체||0)-4; tot.멘=(tot.멘||0)-4; }
  return tot;
}

function scheduleYear(S){
  const items = S.queue.splice(0);

  const free=()=>{ for(let t=0;t<30;t++){ const m=ri(1,12); if(!used.has(m)){ used.add(m); return m; } } return ri(1,12); };
  items.forEach(d=>{
    let m;
    if(d.kind==='death') m=ri(1,12);
    else if(d.kind==='ms') m = MS_MONTH[d.name] ?? free();
    else if(d.kind==='news') m = NEWS[d.idx].m ?? free();
    else if(d.kind==='info') m = /입학/.test(d.title)?3:free();
    else m=free();
    used.add(m); sched.push({m, d});
  });
  if(sched.some(x=>x.d.kind==='death')){ const dm=sched.find(x=>x.d.kind==='death').m; for(const x of sched) if(x.d.kind!=='death' && x.m>dm) x.m=dm; }
  sched.sort((a,b)=>a.m-b.m || (a.d.kind==='death')-(b.d.kind==='death'));
  if(THINK_AGES.includes(S.age) && !S.dead && !sched.some(x=>x.d.kind==='death')) sched.push({m:6, d:{kind:'think'}});
  sched.sort((a,b)=>a.m-b.m);
  S.sched=sched; S.month=0; S.monthDone=0;
  S.yearStart={...S.s, 돈:S.money, year:S.year, age:S.age};
}

function simulateRT(n){
  const out={ages:[], errors:[], endings:{}, cards:[]};
  for(let k=0;k<n;k++){
    try{
      newGame(); scheduleYear(S); let cards=0, yrs=0;
      const play=d=>{ if(d.kind==='death'){ S.dead=true; return; } if(d.kind==='think') return; if(typeof stillValid==='function' && !stillValid(S,d)) return; const c=buildCard(S,d); cards++; const ok=c.choices.map((x,i)=>x.ok?i:-1).filter(i=>i>=0); resolveCard(S,d, ok.length?pick(ok):-1); };
      while(!S.dead && yrs<130){
        const A={}; acts(S).forEach(x=>A[x.k]=ri(0,3)); S.alloc=fixAlloc(S,A);
        for(let m=1;m<=12 && !S.dead;m++){
          monthTick(S);
          while(S.sched.length && S.sched[0].m<=m && !S.dead){ play(S.sched.shift().d); while(S.queue.length && !S.dead) play(S.queue.shift()); }
        }
        if(S.dead) break;
        advance(S); scheduleYear(S); yrs++;
      }
      const e=ending(S); out.ages.push(S.age); out.endings[e.title]=(out.endings[e.title]||0)+1; out.cards.push(cards);
    }catch(err){ out.errors.push(String(err.stack||err)); }
  }
  return out;
}

newGame = function(name, mode){
  const s=_newGame(name, mode);
  const T={};
  INNATE.forEach(t=>T[t]=clamp(Math.round(50+gauss()*13),15,85));
  TRAITS.filter(x=>x.type==='후천').forEach(x=>T[x.k]=ri(0,30));   // 후천: 약간의 성향만
  const star=pick(INNATE); T[star]=clamp(T[star]+ri(22,32),70,99);
  if(R()<.08){ const s2=pick(INNATE.filter(x=>x!==star)); T[s2]=clamp(T[s2]+ri(18,26),65,95); }
  S.tal=T; S.star=star; S.skill={}; TALENTS.forEach(t=>S.skill[t]=0);
  S.focus=star; S.talent=clamp(.78+T.두뇌/220,.8,1.25);

recommendAlloc = function(S){
  const a=S.age, A={};
  if(a<4) Object.assign(A,{study:1, exercise:1, rest:2, fun:2});
  else if(S.armyLeft>0) Object.assign(A,{work:6, exercise:2, rest:2, invest:1});
  else if(a<7) Object.assign(A,{study:2, exercise:2, rest:2, fun:2});
  else if(a<=18) Object.assign(A,{study:5, invest:2, talent:2, exercise:1, rest:2, fun:1, social:1});
  else if(S.studying) Object.assign(A,{study:3, invest:2, talent:1, social:2, rest:2, fun:1, work:1});
  else if(S.job) Object.assign(A,{work:5, invest:2, rest:2, fun:1, family:1, exercise:1});
  else if(S.retired) Object.assign(A,{rest:2, exercise:2, fun:2, social:1});
  else Object.assign(A,{study:3, invest:2, talent:2, rest:2, work:2, fun:1});
  return fixAlloc(S,A);
};
fixAlloc = function(S,A){
  const list=acts(S), T=ptTotal(S), out={}; let tot=0;
  list.forEach(x=>{ out[x.k]=Math.max(x.min, A[x.k]||0); tot+=out[x.k]; });
  const order=['rest','fun','exercise','social','study','invest','talent','style','family','work'].filter(k=>out[k]!=null);
  let g=0;
  while(tot>T && g++<200){ let moved=false; for(const k of order){ const mn=list.find(x=>x.k===k).min; if(tot>T && out[k]>mn){ out[k]--; tot--; moved=true; } } if(!moved) break; }
  g=0; while(tot<T && g++<200){ out[order[g%order.length]]++; tot++; }
  return out;
};
statTargets = function(S,A){
  const p=k=>A[k]||0, a=S.age, T=S.tal||{}, tal=k=>(T[k]??50)-50;
  const busy=p('study')+p('work')+p('invest'), over = busy>=Math.ceil(ptTotal(S)*.75)?1:0;
  const sc = 10/Math.max(6,ptTotal(S));   // 칸이 많을수록 한 칸의 비중은 작다
  return {
    학: clamp(18 + p('study')*sc*(a<26||S.studying?11:7)*S.talent + (S.f.has('학군지')?4:0), 5, 98),
    체: clamp(60 + tal('체격')*.3 + p('exercise')*sc*7*(.8+(T.운동신경??50)/250) + p('rest')*sc*2 - over*10 - Math.max(0,a-40)*.9 - (S.f.has('지병')?12:0), 5, 98),
    멘: clamp(38 + p('rest')*sc*7 + p('fun')*sc*2 + p('family')*sc*2 - over*12 - (p('work')*sc>=6?6:0), 5, 98),
    행: clamp(34 + p('fun')*sc*7 + p('social')*sc*3 + p('family')*sc*3 + (p('talent')*sc*(['예술감각','운동신경'].includes(S.focus)?2:1)) - Math.max(0,p('study')*sc-4)*4 - p('invest')*sc*1 - over*6, 5, 98),
    인: clamp(22 + tal('말솜씨')*.2 + p('social')*sc*10 + p('work')*sc*1.5 + (a<19?6:0), 5, 98),
    매: clamp(28 + tal('외모')*.4 + p('style')*sc*10 + p('exercise')*sc*2, 5, 98),
  };
};
monthTick = function(S){

  S.skill.외국어=Math.max(S.skill.외국어||0, S.h.eng*.8);
  // 상황에 따른 시간 변화
  if(S.studying && !S.f.has('대학pt')){ S.f.add('대학pt'); addPt(S,1,4,'자유로운 대학 생활'); }

function led(S,k,v,src){ if(!v||!src) return; S.led=S.led||{}; const m=S.led[k]=S.led[k]||{}; m[src]=(m[src]||0)+v; }
const _add4 = add;
add = function(S,e){
  if(!S._src) return _add4(S,e);

};
const ACTNAME = k=>{ const x=acts(S).find(a=>a.k===k); return x?x.label.replace(/^특기 연습: /,'')+' 연습':k; };
function driftSrc(S,k,v,A){
  const p=x=>A[x]||0, L=x=>{ const a=acts(S).find(z=>z.k===x); return a?a.label:x; };
  const over=(p('study')+p('work')+p('invest'))>=Math.ceil(ptTotal(S)*.75);
  if(v>0) return ({학:`${L('study')} ${p('study')}칸`, 체:`${L('exercise')} ${p('exercise')}칸`, 멘:`${L('rest')} ${p('rest')}칸`, 행:`${L('fun')} ${p('fun')}칸`, 인:`${L('social')} ${p('social')}칸`, 매:`${p('style')?L('style')+' '+p('style')+'칸':'타고난 모습'}`})[k];
  if(k==='체') return S.age>40?'나이':over?'무리한 일정':S.f.has('지병')?'지병':'운동 부족';
  if(k==='멘') return over?'과로·공부 압박':'쉴 시간 부족';
  if(k==='행') return p('study')>5?'공부 압박':over?'바쁜 일상':'놀 시간 부족';
  if(k==='학') return p('study')?'배운 걸 잊음':'공부 안 함';
  if(k==='인') return '친구 만날 시간 부족';
  if(k==='매') return '관리 부족';
  return '시간 계획';
}

// 연초 정산(월급·생활비·양육비·대출)도 이유를 남긴다
const _yt2 = yearTick;
yearTick = function(S,ms){
  const m0=S.money, b={...S.s}, job=S.job?{...S.job}:null, kids=S.kidBirth.filter(x=>{const a=S.age+1-x; return a>=0&&a<22;}).length, loan=S.house?S.house.loan:0, retired=S.retired, pension=S.pension;
  _yt2(S,ms);
  const fin={};
  if(job) fin['월급에서 저축']=job.sal*.13;
  else if(retired) fin['연금 - 생활비']=(S.age>=65?pension:pension*.5)-1600;
  else if(S.age>=24 && !S.studying && S.armyLeft===0) fin['생활비']=-(S.wealth>=8?150:500);
  if(kids) fin[`양육비 (${kids}명)`]=-800*kids;
  if(loan>0) fin['대출 상환·이자']=-(Math.min(loan,1800)+Math.max(0,loan-1800)*.035);
  const rest=(S.money-m0)-Object.values(fin).reduce((a,c)=>a+c,0); if(Math.abs(rest)>=1) fin['이자·기타']=rest;
  S.fin=fin; S.finStat={};
  for(const k of Object.keys(SK)){ const d=S.s[k]-b[k]; if(Math.abs(d)>.3) S.finStat[k]=d; }
};
function settlementHtml(S){
  const lines=[]; const ys=S.yearStart||{};
  const keys=[...Object.keys(SK),'돈'];
  for(const k of keys){
    const m={...(S.led&&S.led[k]||{})};
    if(k==='돈') for(const [s,v] of Object.entries(S.fin||{})) m[s]=(m[s]||0)+v;
    else if(S.finStat&&S.finStat[k]) m[k==='체'?'나이':'세월'] = (m[k==='체'?'나이':'세월']||0)+S.finStat[k];
    const tot=Object.values(m).reduce((a,c)=>a+c,0);
    if(k==='돈' ? Math.abs(tot)<10 : Math.abs(tot)<1.5) continue;
    const top=Object.entries(m).filter(([s,v])=>k==='돈'?Math.abs(v)>=10:Math.abs(v)>=.8).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,3);
    const fmt=v=>k==='돈'? (v>0?'+':'')+won(v) : (v>0?'+':'')+Math.round(v);
    lines.push(`<div class="srow"><span class="d ${tot>0?'up':'down'}">${k==='돈'?'돈':SK[k]} ${fmt(tot)}</span><span class="why">${top.map(([s,v])=>`${esc(s)} ${fmt(v)}`).join(' · ')}</span></div>`);
  }
  return lines.join('');
}

const _st2 = statTargets;
statTargets = function(S,A){
  const T=_st2(S,A);

};
const _mt4 = monthTick;

function estP(S,t){
  if(JOBCAT[t]) return clamp(JOBCAT[t].p(S),0,1);
  return ({대기업:.12+tierBonus(S)*1.6+S.h.spec/250, 공무원:.15+S.s.학/1000, 교사:.2+S.s.학/600, 간호사:.9, 개발자:.2+ab(S,'코딩')/150+tierBonus(S),
    중소기업:.88, 생산직:.6, 운동선수:(ab(S,'운동신경')-70)/28, '배우·모델':(ab(S,'외모')-70)/30, '디자이너·예술가':(ab(S,'예술감각')-45)/45,
    셰프:(ab(S,'손재주')-15)/45, 기술자:(ab(S,'손재주')-15)/45, 영업직:.3+ab(S,'말솜씨')/120, 크리에이터:.12+(ab(S,'말솜씨')+ab(S,'외모')-90)/250, 아이돌:.06})[t] ?? .3;
}
function trackOptions(S){
  const o=[];
  if(S.f.has('졸업')) o.push('대기업');
  o.push('공무원');
  if(S.major==='사범대') o.push('교사'); if(S.major==='간호학과') o.push('간호사');
  if(S.major==='공대'||ab(S,'코딩')>=25||S.f.has('코딩관심')) o.push('개발자');
  if(ab(S,'운동신경')>=77) o.push('운동선수'); if(ab(S,'외모')>=77) o.push('배우·모델');
  if(ab(S,'예술감각')>=50) o.push('디자이너·예술가'); if(ab(S,'손재주')>=28){ o.push('셰프'); o.push('기술자'); }
  if(ab(S,'말솜씨')>=20) o.push('영업직');
  if(S.f.has('연습생')) o.push('아이돌'); if(S.f.has('크리에이터꿈')||ab(S,'말솜씨')>=50) o.push('크리에이터');
  Object.keys(JOBCAT).forEach(t=>{ if(JOBCAT[t].show(S)) o.push(t); });
  o.push('중소기업'); if(!S.f.has('졸업')) o.push('생산직');
  const uniq=[...new Set(o)];
  return uniq.sort((a,b)=>estP(S,b)*(a==='중소기업'||a==='택배 기사'||a==='보험설계사'?1:1.6)-estP(S,a)*(b==='중소기업'||b==='택배 기사'||b==='보험설계사'?1:1.6)+0);
}

MS.track.build = function(S,d){

  if(all.length>per) ch.push({l:'다른 길 보기', run:S=>{ S.queue.unshift({kind:'ms', name:'track', page:(page+1)%Math.ceil(all.length/per)}); return ''; }});

};

const MB_AX = [['E','I'],['N','S'],['F','T'],['P','J']];
function mbType(S){ const m=S.mb; if(!m) return '----'; return (m.E>=50?'E':'I')+(m.N>=50?'N':'S')+(m.F>=50?'F':'T')+(m.P>=50?'P':'J'); }
function mbShift(S, text, w){
  if(!S.mb || !text) return;
  for(const [hi,lo] of MB_AX){ if(MB_KW[hi].test(text)) S.mb[hi]=clamp(S.mb[hi]+w,3,97); if(MB_KW[lo].test(text)) S.mb[hi]=clamp(S.mb[hi]-w,3,97); }
}

const _ng3 = newGame;
newGame = function(name, mode){
  const r=_ng3(name, mode);
  const T=S.tal||{};
  S.mb={ E:clamp(50+gauss()*16+(S.impulsive-.5)*16+(S.siblings>0?4:-2),8,92),
         N:clamp(50+gauss()*13+((T.예술감각||50)-50)*.35,8,92),
         F:clamp(50+gauss()*15+(S.family==='화목'?5:S.family==='갈등'?-4:0),8,92),
         P:clamp(50+gauss()*13+(S.impulsive-.5)*28,8,92) };
  S.mb0={...S.mb}; S.mbHist=[]; S.mbLast=null;
  return r;
};

const _mt6 = monthTick;
monthTick = function(S){
  _mt6(S);
  if(!S.mb || S.age<4) return;
  const A=S.alloc||{}, p=k=>A[k]||0, k=1/12, tot=Math.max(6,ptTotal(S));
  const d={ E:(p('social')+p('style')*.5-p('rest')*.5-p('study')*.2)/tot*6,
            N:((['예술감각','코딩','말솜씨','외모'].includes(S.focus)?p('talent'):0) + p('fun')*.3 + p('study')*.05 - p('work')*.2 - p('invest')*.2)/tot*5,
            F:(p('family')+p('social')*.3-p('invest')*.4-p('study')*.3)/tot*5,
            P:(p('fun')+p('social')*.2+p('talent')*.2-p('study')*.3-p('invest')*.4)/tot*6 };
  // 타고난 기질(mb0)로 되돌아가려는 힘이 있어, 생활이 성격을 조금씩만 바꾼다
  const base=S.mb0||{E:50,N:50,F:50,P:50};
  for(const a in d) S.mb[a]=clamp(S.mb[a]+(d[a]*.5-(S.mb[a]-base[a])*.06)*k,3,97);
};

const _rc = resolveCard;
resolveCard = function(S,d,i){
  let label='';
  try{ if(d.kind==='ev'&&i>=0) label=EVMAP[d.id].c[i].l; else if(d.kind==='news'&&i>=0&&NEWS[d.idx].c) label=NEWS[d.idx].c[i].l; else if(d.kind==='ms'&&d._m&&i>=0&&d._m.choices[i]) label=d._m.choices[i].l; }catch(e){}
  const txt=_rc(S,d,i);
  if(S.age>=4) mbShift(S, label+' '+(txt||''), S._decide?5:1.6);

const _ng5 = newGame;
newGame = function(n,m){
  const r=_ng5(n,m);
  const w=S.wealth, pC = w<=3?.24: w<=7?.15:.09, pH = w<=3?.32: w<=7?.40:.48;
  const x=R(), fam = x<pC?'갈등': x<pC+pH?'화목':'보통';
  if(fam!==S.family){ const a=FAM_EFF[S.family], b=FAM_EFF[fam]; S.s.멘+=b.멘-a.멘; S.s.행+=b.행-a.행; S.h.par=b.par; S.h.risk=Math.max(0,S.h.risk+b.risk-a.risk); S.family=fam; }

};

  const net=S.money+(S.inv||0)+(S.house?S.house.val-S.house.loan:0);
  if(S.age>=65 && net<50000) S.money+=400;
  if(S.money<-15000 && !S.house && !S.f.has('개인회생')){ S.f.add('개인회생'); S.money=-3000; S.s.멘=Math.max(5,S.s.멘-10); hl(S,`${S.age}세, 개인회생으로 빚을 정리했다`); ms.push({kind:'info', title:'개인회생', text:'법원에서 개인회생이 받아들여졌다. 빚의 대부분이 정리됐다. 다시 시작한다.'}); }
};
DATA_SRC.push(['노후 제도', '65세 이상 소득 하위 70% 기초연금(월 약 33만원 수준), 과도한 빚은 개인회생·파산으로 정리', '보건복지부 기초연금 · 법원 개인회생 제도']);

/* ===== 소득 기록: 연봉 · 평생 연평균 소득 ===== */
function takeHomeRate(sal){ return sal<=2400?.09: sal<=4000?.12: sal<=6000?.15: sal<=10000?.2: .27; } // 4대보험+소득세 대략
function netMonthly(sal){ return sal*(1-takeHomeRate(sal))/12; }
const _ytInc = yearTick;
yearTick = function(S,ms){
  if(S.job && S.job.sal>0){ S.incSum=(S.incSum||0)+S.job.sal; S.incYears=(S.incYears||0)+1; S.incPeak=Math.max(S.incPeak||0,S.job.sal); }
  _ytInc(S,ms);
};
function avgIncome(S){ return S.incYears? S.incSum/S.incYears : 0; }

/* ===== 보정 (2026-11): 자산 출처 기록 · 직업 쏠림 · 웹툰 연봉 ===== */

// 1) 자산이 어디서 왔는지 기록한다: 월급 저축 / 투자 수익 / 상속 / 횡재 / 큰 지출
function srcOf(S){ return S.src || (S.src={save:0, inv:0, inherit:0, luck:0, loss:0}); }
const _ytT = yearTick;
yearTick = function(S,ms){
  if(S.job && S.job.sal>0) srcOf(S).save += S.job.sal*.13;
  _ytT(S,ms);
};
const _mtT = monthTick;
monthTick = function(S){
  const g0=S.invGain||0; _mtT(S);
  const g1=S.invGain||0; if(g1>=g0) srcOf(S).inv += g1-g0;   // 연초 초기화된 달은 건너뛴다
};
const _parB = MS.parents.build;
MS.parents.build = function(S,d){ const b=S.money; const r=_parB(S,d); srcOf(S).inherit += S.money-b+0; return r; };
const _rcT = resolveCard;
resolveCard = function(S,d,i){
  const b=S.money+(S.inv||0); const t=_rcT(S,d,i);
  const dd=S.money+(S.inv||0)-b;
  if(d.kind==='ev' || d.kind==='news'){ if(dd>=3000) srcOf(S).luck+=dd; else if(dd<=-3000 && !(d.id==='buy_house')) srcOf(S).loss+=dd; }
  return t;
};
// 엔딩에서 쓰는 요약: [이름, 금액] 목록과 가장 큰 출처
function assetSources(S, total){
  const s=srcOf(S), house=S.house? (S.house.val-(S.house.bought||S.house.val)) : 0;
  const L=[['월급 저축',s.save],['투자 수익',s.inv],['상속',s.inherit],['집값 상승',house],['뜻밖의 돈',s.luck]].filter(x=>Math.abs(x[1])>=100);
  const known=L.reduce((a,x)=>a+x[1],0)+s.loss;
  const spend=total-known;   // 생활비·대출 이자·사건 지출 등 나머지
  if(s.loss<=-100) L.push(['큰 지출·손실',s.loss]);
  if(Math.abs(spend)>=100) L.push([spend<0?'생활비·이자 등':'기타',spend]);
  const top=L.filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1])[0];
  return {list:L, top: top? top[0] : null};
}

// 2) 진로 목록: 붙을 확률 × 직업의 매력(위신)으로 정렬 → 사회복지사·웹툰만 맨 위에 오지 않게
const _toT = trackOptions;
trackOptions = function(S){
  const L=_toT(S).filter(t=> t!=='웹툰 작가' || ab(S,'예술감각')>=50);
  const sc=t=> clamp(estP(S,t),0,.85) * (.45 + (PRESTIGE[t]??4)/10);
  return L.sort((a,b)=>sc(b)-sc(a));
};
if(JOBCAT['웹툰 작가']){ JOBCAT['웹툰 작가'].p = S=>(ab(S,'예술감각')-45)/70; JOBCAT['웹툰 작가'].show = S=>ab(S,'예술감각')>=50; }

// 3) 자영업형 직업도 경력이 쌓이면 수입이 오른다 (웹툰 2,400만원 50년 고정 문제)
const _sgT = salGrowth;
salGrowth = function(S){
  const j=S.job; if(!j) return 1;
  if(j.kind==='자영' && S.age<50){
    if(j.name==='웹툰 작가'||j.name==='크리에이터'||j.name==='배우·모델') return j.sal<9000? 1.035 : 1.0;
    return 1.015;
  }
  return _sgT(S);
};

// 4) 상속: 출생 분위별 부모 순자산(통계청 가계금융복지조사 2024 순자산 10분위 평균 근사)
//    → 노후에 쓰고 남은 만큼 → 상속세(일괄공제 5억, 10~50% 누진) → 형제 수로 나눈다
//    재벌가(0.1%)는 상속재산 100억 초과 피상속인 비율(국세청 상속세 결정 현황, 사망자의 약 0.1%)에 맞춘다
const PARENT_NET = [0, 800, 4000, 9000, 15000, 22000, 30000, 40000, 55000, 80000, 170000]; // 만원, 1~10분위
function inheritTax(v){ const t=v-50000; if(t<=0) return 0;
  return t<=10000? t*.1 : t<=50000? t*.2-1000 : t<=100000? t*.3-6000 : t<=300000? t*.4-16000 : t*.5-46000; }
function inheritAmount(S){
  let estate;
  if(S.rich) estate = Math.round(150000*Math.exp(gauss()*.8));       // 재벌가: 중간값 150억, 수십억~수천억
  else {
    const w=clamp(Math.round(S.wealth0||S.wealth),1,10);
    estate = PARENT_NET[w]*Math.exp(gauss()*.45)*(.55+R()*.35);      // 노후 생활비·간병비로 일부를 쓰고 남은 재산
    if(w<=2 && R()<.5) estate=0;                                     // 남길 재산이 없는 경우
  }
  estate=Math.max(0,Math.round(estate));
  const tax=Math.round(inheritTax(estate)); S._inhTax = tax>0? Math.round(tax/(S.siblings+1)) : 0;
  return Math.round((estate-tax)/(S.siblings+1));
}

/* ===== 실시간 뉴스: 매주 자동 업데이트되는 파일 =====
   - 이 파일만 고친다. NEWS 끝에 push 하므로 기존 뉴스 번호(저장 데이터)가 바뀌지 않는다.
   - 실제 일어난 일만, 특정 정치인·범죄 피해자·실명 개인은 넣지 않는다.
   - LIVE_UPDATED: 마지막 확인 날짜 / KOSPI_LIVE: 올해 코스피 연초 대비 등락률(%) */
const LIVE_UPDATED = '2026-11-19';
const KOSPI_LIVE = {2026: 25.5};   // 2025년 말 약 4,214 → 2026-11-13 5,290 마감
Object.assign(KOSPI, KOSPI_LIVE);
NEWS.push(
{y:2026, a:[20,70], h:'코스피 5,000 시대, AI 반도체 기대에 증시 출렁', t:'단톡방에 “코스피 5천”이 떴다. 오르는 날엔 다들 천재, 떨어지는 날엔 다들 조용하다.', c:[
  {l:'조금 더 사본다', need:S=>S.money>300, needT:'돈 300만원 이상', run:S=>{ const m=Math.min(S.money,1500); if(R()<.5){ add(S,{돈:Math.round(m*.15), 행:3}); return '며칠 뒤 올랐다. 괜히 차트를 하루에 스무 번 봤다.'; } add(S,{돈:-Math.round(m*.12), 멘:-3}); return '사자마자 5천 아래로 밀렸다. 앱 알림을 껐다.'; }},
  {l:'지켜만 본다', e:{}, t:'남들 수익 인증을 보며 배가 조금 아팠다.'}]},
{y:2026, a:[17,20], if:S=>!S.f.has('수능포기') && !S.job, h:'수능 AI 부정행위 대책: 스마트기기 전면 반납·와이파이 차단', t:'시험장 앞에서 스마트워치까지 봉투에 넣었다. 감독관이 귀를 유심히 본다.', e:{멘:-1}},
{y:2026, a:[20,60], if:S=>!!S.job, h:'국가자격시험 AI 부정행위 논란', t:'회사 자격증 시험도 감독이 깐깐해졌다. 옆자리 동료가 “요즘은 안경도 검사한대”라며 웃었다.', e:{}}
);

</script>
<script>
const app=document.getElementById('app');
const STAGES=[['영유아',0],['초등',7],['중등',13],['고등',16],['청년',19],['장년',30],['중년',50],['노년',65]];
const SPEEDS=[0,1,2,4,8,16];
let speed=1, auto=false, pending=null, timer=null, lastSpeed=1, ended=false;
try{ const v=+localStorage.getItem('k50m-speed'); if(SPEEDS.includes(v)&&v>0) speed=v; }catch(e){}
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function save(){ try{ if(S&&!S.dead) localStorage.setItem('k50m-rt', serializeRT(S)); else localStorage.removeItem('k50m-rt'); }catch(e){} }
function loadSave(){ try{ const s=localStorage.getItem('k50m-rt'); return s?deserialize(s):null; }catch(e){ return null; } }

/* ---------- 시작 ---------- */
function startScreen(){
  stop(); ended=false; pending=null;
  const sv=loadSave();
  app.innerHTML=`<section class="start">
    <div class="eyebrow">대한민국 인생 시뮬레이션</div>
    <h1>오천만분의 일</h1>
    <p>1990~2010년 사이, 대한민국 어딘가에서 태어납니다. 지역도, 집안도, 성별도 고를 수 없습니다. 시간은 저절로 흐르고, 인생의 갈림길에서만 멈춥니다.</p>
    <form class="form sheet" id="sf">
      <label for="nm">이름 (비워두면 그 시절 흔한 이름으로)</label>
      <input id="nm" maxlength="8" autocomplete="off" placeholder="예: 김지훈">
      <button class="btn primary" type="submit">태어나기</button>
      ${sv?`<button class="btn ghost" type="button" id="resume">이어하기: ${esc(sv.name)}, ${sv.age}세 (${sv.year}년)</button>`:''}
    </form>
    <div class="facts">
      <div><b>1년 ≈ 2분</b>1배속 기준. 최대 16배속</div>
      <div><b>시간 총량</b>학생 때 14칸이 최대. 미래 투자와 재능 연습</div>
      <div><b>갈림길</b>진학·입대·취업·결혼·집에서 멈춤</div>
    </div>
    <details class="sheet src"><summary>이 게임의 통계 근거</summary><ul>${DATA_SRC.map(d=>`<li><b>${esc(d[0])}</b> · ${esc(d[1])}<small>${esc(d[2])}</small></li>`).join('')}</ul><p class="note" style="text-align:left">일부 수치는 공식 원자료가 아닌 보도·연구 인용이며, 게임에서는 단순화해 반영했습니다. 등장하는 회사·대학·단체 이름은 모두 가상입니다. 실제 뉴스는 매주 업데이트됩니다 (마지막 확인: ${LIVE_UPDATED}).</p></details>
    <p class="note">15세 이상 · 질병, 사고, 일탈 묘사가 포함되어 있습니다. 단축키: 스페이스(정지/재생), 1~5(배속), 숫자(선택)</p>
  </section>`;
  document.getElementById('sf').addEventListener('submit',e=>{ e.preventDefault(); newGame(document.getElementById('nm').value.trim()||null); S.alloc=recommendAlloc(S); S.feed=[]; scheduleYear(S); S.lastPt=ptTotal(S); feedYear(); begin(); });
  const r=document.getElementById('resume'); if(r) r.addEventListener('click',()=>{ S=sv; S.feed=S.feed||[]; begin(); });
}

/* ---------- 피드 ---------- */
function pushFeed(kind, html, plain){ S.feed.push({k:kind, h:html, m:Math.min(12,S.monthDone||1), y:S.year, a:S.age}); if(S.feed.length>400) S.feed.splice(0,S.feed.length-400); renderFeedTop(); }
function feedYear(){ const st=stageOf(S.age); pushFeed('yr', `${S.year}년 · ${S.age}세 <span style="font-weight:400;font-size:13px;color:var(--muted)">${esc(st)}</span>`); }
function dHtml(a,b){ let o=''; for(const k of Object.keys(SK)){ const d=Math.round(b[k]-a[k]); if(Math.abs(d)>=2) o+=`<span class="d ${d>0?'up':'down'}">${SK[k]}${d>0?'+':''}${d}</span>`;} const dm=Math.round(b.돈-a.돈); if(Math.abs(dm)>=10) o+=`<span class="d ${dm>0?'up':'down'}">${dm>0?'+':''}${won(dm)}</span>`; return o; }
function snap(){ return {...S.s, 돈:S.money}; }

/* ---------- 진행 ---------- */
function begin(){ renderAll(); start(); }
function start(){ stop(); timer=setInterval(tick,100); }
function stop(){ if(timer) clearInterval(timer); timer=null; }
function tick(){
  if(ended||pending||!speed) return;
  S.month += .01*speed;            // 1배속: 한 달 10초, 1년 2분
  while(!pending && !ended && Math.floor(S.month) > S.monthDone){
    S.monthDone++;
    const m=S.monthDone;
    monthTick(S);
    if(m%2===1 || speed<=2){ const l=monthLine(S,m); if(l) pushFeed('m', esc(l)); }
    processMonth(m);
    if(S.monthDone>=12 && !pending && !ended){ yearEnd(); }
    save();
  }
  updateClock(); updateStats();
}
function processMonth(m){
  while(!pending && !ended){
    let d=null;
    if(S.queue.length) d=S.queue.shift();
    else if(S.sched.length && S.sched[0].m<=m) d=S.sched.shift().d;
    else break;
    handle(d);
  }
}
function handle(d){
  if(d.kind==='death' || S.dead){ return finish(); }
  if(!stillValid(S,d)) return;
  if(d.kind==='think'){ pending={d, think:true}; renderDecide(); if(auto) setTimeout(autoPick, Math.max(300, 1500/speed)); return; }
  const before=snap();
  S._src = d.kind==='news'? NEWS[d.idx].h.replace(/^\[[^\]]+\]\s*/,'').slice(0,18) : '사건';
  const card=buildCard(S,d);
  S._src = srcLabel(d,card);
  if(isDecision(d,card)){ pending={d, card, before, src:S._src}; S._src=null; renderDecide(); if(auto) setTimeout(autoPick, Math.max(300, 1500/speed)); return; }
  // 흘러가는 사건: 캐릭터가 알아서
  const idx = card.choices.length ? autoIndex(S,d,card) : -1;
  if(d.kind==='ev' && idx<0){ S.seen.add(d.id); S._src=null; return; }
  const txt = resolveCard(S,d,idx);
  S._src=null;
  const delta = dHtml(before, snap());
  if(d.kind==='news') pushFeed('news', `<b>${esc(card.headline)}</b>${esc(firstPara(card.text))}${txt&&card.choices.length?' '+esc(txt):''}${delta}`);
  else if(d.kind==='ms'||d.kind==='info') pushFeed('big', `${esc(card.title||'')}${card.title?' · ':''}${esc(firstPara(card.text))}${delta}`);
  else pushFeed('e', `${esc(shortQ(card.text))} <span style="color:var(--muted)">→</span> ${esc(txt||card.choices[idx]?.l||'')}${delta}`);
  if(S.dead) finish();
}
function srcLabel(d,card){ if(d.kind==='news') return (card.headline||'뉴스').replace(/^\[[^\]]+\]\s*/,'').slice(0,18); if(d.kind==='ms'||d.kind==='info') return card.title||'인생 사건'; let t=String(card.text).split(/[.?!…\n]/)[0].replace(/[“”"]/g,'').trim(); return t.length>18?t.slice(0,17)+'…':t; }
function firstPara(t){ return String(t).split('\n\n')[0]; }
function shortQ(t){ t=String(t); return t.length>60? t.slice(0,58)+'…' : t; }
function choose(i, note){
  if(!pending) return;
  const p=pending; pending=null;
  if(p.think){
    const ts=thinkSpec(p.d); S.thoughts=S.thoughts||[]; S.thoughts.push({age:S.age, mood:ts.o[i], note:note||'', q:ts.q});
    pushFeed('think', `“${esc(note||ts.o[i])}” <span style="color:var(--muted);font-family:var(--body);font-size:12px">— ${S.age}세의 생각</span>`);
  } else {
    S._src=p.src; S._decide=true; const txt=resolveCard(S,p.d,i); S._src=null; S._decide=false;
    const lab=p.card.choices[i]?.l||'';
    const head = p.d.kind==='news' ? `<b style="color:var(--news)">${esc(p.card.headline)}</b> ` : '';
    pushFeed('dec', `${head}${esc(lab)}<small>${esc(txt||'')}</small>${dHtml(p.before, snap())}`);
  }
  renderDecide();
  save();
  if(S.dead) return finish();
  processMonth(S.monthDone);
  if(!pending && S.monthDone>=12 && !ended) yearEnd();
  updateStats(); renderPlan();
}
function autoPick(){ if(!pending||!auto) return; if(pending.think) return choose(1); const idx=pending.card.choices.map((c,i)=>c.ok?i:-1).filter(i=>i>=0); choose(pick(idx)); }
function yearEnd(){
  const ys=S.yearStart;
  const sh=settlementHtml(S);
  if(sh) pushFeed('settle', `<div class="stitle">${S.year}년 결산</div>${sh}`);
  advance(S);
  const oldPlan=JSON.stringify(S.alloc);
  S.alloc = S.customPlan ? fixAlloc(S, S.alloc||{}) : recommendAlloc(S);
  scheduleYear(S);
  feedYear();
  if(S.mbNews){ pushFeed('mb', esc(S.mbNews)); S.mbNews=null; }
  const nt=ptTotal(S); if(nt!==S.lastPt){ pushFeed('m', `올해 쓸 수 있는 시간: ${nt}칸${S.lastPt!=null?` (${nt>S.lastPt?'+':''}${nt-S.lastPt})`:''}`); S.lastPt=nt; }
  else if(JSON.stringify(S.alloc)!==oldPlan) pushFeed('m','상황이 바뀌어 올해 시간 계획이 조정됐다.');
  renderPlan(); renderClockMarks();
}
function finish(){ ended=true; stop(); save(); setTimeout(showEnding, 900); }

/* ---------- 그리기 ---------- */
function renderAll(){
  app.innerHTML=`
  <header class="clock" id="clock"></header>
  <div id="decide"></div>
  <div class="sheet topstats" id="stats"></div>
  <div class="cols">
    <div class="lcol">
      <div class="sheet plan" id="plan"></div>
    </div>
    <section class="sheet feedbox rcol"><h3 class="fh">지금 내 인생 <button class="btn ghost" id="more">전체</button></h3><ul class="feed" id="feed"></ul></section>
  </div>`;
  const ck=document.getElementById('clock');
  const setH=()=>document.documentElement.style.setProperty('--clockH', ck.offsetHeight+'px');
  setH(); try{ new ResizeObserver(setH).observe(ck); }catch(e){}
  document.getElementById('more').addEventListener('click',e=>{ feedAll=!feedAll; e.target.textContent=feedAll?'최근':'전체'; renderFeedAll(); });
  renderClock(); renderDecide(); updateStats(); renderPlan(); renderFeedAll();
}
function renderClock(){

  if(S.f.has('전우')) L.push('훈련소 동기 전우회');

  if(S.f.has('의리')) L.push('평생의 친구');

function drawWreath(g,x,y,s,label,t){

    g.fillStyle='#f8f5ec'; g.beginPath(); g.moveTo(-rw/2,0); g.lineTo(rw/2,0); g.lineTo(rw/2,len); g.lineTo(0,len-rw*.45); g.lineTo(-rw/2,len); g.closePath(); g.fill();
    g.strokeStyle='rgba(120,100,70,.35)'; g.lineWidth=Math.max(.6,s*.006); g.stroke();

  ${e.titles.length?`<section class="sheet"><h3 class="dh">칭호</h3><div class="titles">${e.titles.map(t=>`<span>${esc(t)}</span>`).join('')}</div></section>`:''}
  <p class="note">통계와 뉴스는 실제 자료를 참고했지만 게임 속 수치는 단순화되어 있습니다. 2027년 이후 사건은 가상의 시나리오입니다. 등장하는 회사·학교·단체 이름은 모두 가상이며 실제와 관계없습니다.</p>
  </div>`;
  document.getElementById('more').addEventListener('click',ev=>{ const d=document.getElementById('detail'); d.hidden=!d.hidden; ev.currentTarget.textContent=d.hidden?'자세히 보기':'접기'; if(!d.hidden) d.scrollIntoView({behavior:'smooth', block:'start'}); });
  document.getElementById('again').addEventListener('click',()=>{ S=null; startScreen(); window.scrollTo(0,0); });
  document.getElementById('copy').addEventListener('click',async ev=>{ const b=ev.currentTarget; try{ await navigator.clipboard.writeText(share); b.textContent='복사됨'; }catch(err){ const t=document.getElementById('sharetxt'); t.hidden=false; t.select(); b.textContent='아래 글을 복사하세요'; } });
  window.scrollTo(0,0);
}

window.claude?.hot?.snapshot?.(()=>({save:S&&!S.dead?serializeRT(S):null}));
function boot(data){ if(data&&data.save){ try{ S=deserialize(data.save); S.feed=S.feed||[]; return begin(); }catch(e){} } startScreen(); }
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
window.__sim=simulateRT;
window.__turbo=(v)=>{ auto=true; speed=v; };
</script>
